<div class="flex items-center justify-center min-h-screen bg-gradient-to-br from-slate-50 via-emerald-50 to-slate-100 px-4">
  <div class="bg-white/80 backdrop-blur-md p-8 rounded-3xl shadow-2xl w-full max-w-md border border-slate-100 transition-all duration-300">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-12 h-12 bg-emerald-600 text-white rounded-2xl shadow-lg shadow-emerald-500/30 mb-4 font-bold text-xl">
        CQ
      </div>
      <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Create an account</h2>
      <p class="text-sm text-slate-500 mt-1">Set up your ChatQuarkus workspace</p>
    </div>
    <form (ngSubmit)="onRegister()" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Name</label>
        <input type="text" [(ngModel)]="name" name="name" required pInputText class="w-full p-inputtext-sm rounded-xl border-slate-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-all" placeholder="Your full name">
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Email</label>
        <input type="email" [(ngModel)]="email" name="email" required pInputText class="w-full p-inputtext-sm rounded-xl border-slate-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-all" placeholder="name@company.com">
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Password</label>
        <input type="password" [(ngModel)]="password" name="password" required pInputText class="w-full p-inputtext-sm rounded-xl border-slate-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-all" placeholder="••••••••">
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Company Name</label>
        <input type="text" [(ngModel)]="companyName" name="companyName" required pInputText class="w-full p-inputtext-sm rounded-xl border-slate-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-all" placeholder="Company Inc.">
      </div>
      <button pButton type="submit" label="Register" icon="pi pi-user-plus" iconPos="right" class="w-full p-button-success rounded-xl py-3 font-semibold shadow-lg shadow-emerald-600/20 transition-all hover:shadow-emerald-600/40 mt-2"></button>

      <div *ngIf="errorMessage" class="p-3 bg-red-50 border border-red-100 text-red-600 rounded-xl text-sm text-center font-medium">
        {{ errorMessage }}
      </div>
      <div *ngIf="successMessage" class="p-3 bg-emerald-50 border border-emerald-100 text-emerald-700 rounded-xl text-sm text-center font-medium">
        {{ successMessage }}
      </div>
    </form>
    <p class="mt-6 text-center text-sm text-slate-500">
      Already have an account? <a routerLink="/login" class="text-emerald-600 font-semibold hover:text-emerald-700 transition-colors">Sign in</a>
    </p>
  </div>
</div>
