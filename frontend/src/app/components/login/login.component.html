<div class="relative flex items-center justify-center min-h-screen bg-slate-950 px-4 overflow-hidden">
  <!-- Dynamic ambient background lighting -->
  <div class="absolute -top-40 -left-40 w-96 h-96 bg-sky-600/20 rounded-full blur-3xl login-bg-glow"></div>
  <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl login-bg-glow" style="animation-delay: 4s;"></div>

  <div class="relative z-10 glass-panel p-10 sm:p-12 rounded-[2.5rem] shadow-[0_25px_60px_-15px_rgba(0,0,0,0.3)] w-full max-w-md transition-all duration-300">

    <!-- Header Branding -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-tr from-sky-600 to-indigo-600 text-white rounded-2xl shadow-xl shadow-sky-500/25 mb-4 font-black text-2xl tracking-wider transform hover:scale-105 transition-transform">
        CQ
      </div>
      <h2 class="text-2xl font-black text-slate-900 tracking-tight">Welcome back</h2>
      <p class="text-sm font-medium text-slate-500 mt-1">Sign in to your ChatQuarkus workspace</p>
    </div>

    <!-- Login Form -->
    <form (ngSubmit)="onLogin()" class="space-y-5">
      <div>
        <label class="block text-xs font-bold uppercase tracking-widest text-slate-600 mb-2">Username</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-slate-400">
            <i class="pi pi-user text-sm"></i>
          </span>
          <input type="text" [(ngModel)]="username" name="username" required pInputText class="w-full pl-11 pr-4 py-3 bg-slate-50/50 border border-slate-200 rounded-2xl text-slate-900 placeholder-slate-400 font-medium focus:bg-white focus:border-sky-500 input-field-glow transition-all outline-none" placeholder="Enter your username">
        </div>
      </div>

      <div>
        <div class="flex items-center justify-between mb-2">
          <label class="block text-xs font-bold uppercase tracking-widest text-slate-600">Password</label>
          <a href="#" (click)="$event.preventDefault()" class="text-xs font-bold text-sky-600 hover:text-sky-700 transition-colors">Forgot password?</a>
        </div>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-slate-400">
            <i class="pi pi-lock text-sm"></i>
          </span>
          <input type="password" [(ngModel)]="password" name="password" required pInputText class="w-full pl-11 pr-4 py-3 bg-slate-50/50 border border-slate-200 rounded-2xl text-slate-900 placeholder-slate-400 font-medium focus:bg-white focus:border-sky-500 input-field-glow transition-all outline-none" placeholder="••••••••">
        </div>
      </div>

      <button pButton type="submit" [disabled]="isLoading" class="w-full bg-gradient-to-r from-sky-600 to-indigo-600 text-white font-bold py-3.5 px-6 rounded-2xl shadow-xl shadow-sky-600/25 hover:shadow-sky-600/40 hover:from-sky-500 hover:to-indigo-500 active:scale-[0.98] transition-all flex items-center justify-center space-x-2">
        <span *ngIf="!isLoading">Sign in</span>
        <span *ngIf="isLoading">Signing in...</span>
        <i *ngIf="isLoading" class="pi pi-spin pi-spinner text-sm ml-2"></i>
        <i *ngIf="!isLoading" class="pi pi-arrow-right text-xs ml-2"></i>
      </button>

      <!-- Error Notification -->
      <div *ngIf="errorMessage" class="p-4 bg-red-50/80 backdrop-blur border border-red-200 text-red-600 rounded-2xl text-sm text-center font-semibold flex items-center justify-center space-x-2 animate-shake">
        <i class="pi pi-exclamation-circle text-base"></i>
        <span>{{ errorMessage }}</span>
      </div>
    </form>

    <!-- Footer Register prompt -->
    <p class="mt-8 text-center text-sm font-medium text-slate-500">
      Don't have an account? <a routerLink="/register" class="text-sky-600 font-bold hover:text-sky-700 transition-colors">Create account</a>
    </p>

  </div>
</div>
